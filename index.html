<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>キャッシュフロー</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>キャッシュフロー</h1>
    <div><span id="status"></span><button class="hbtn" id="btnList" title="登録一覧">一覧</button><button class="hbtn" id="btnReload" title="再読み込み">⟳</button><button class="hbtn" id="btnSettings" title="設定">⚙</button></div>
  </header>
  <div id="main"></div>
</div>
<button class="fab" id="fab" aria-label="予定を追加">＋</button>
<div id="modal"></div>
<!-- calc.js：計算 / util.js：共通・入力 / github.js：保存 / main.js：メイン画面 / chart.js：グラフ / forms.js：入力画面 -->
<script src="calc.js"></script>
<script src="util.js"></script>
<script src="github.js"></script>
<script src="main.js"></script>
<script src="chart.js"></script>
<script src="forms.js"></script>
<script>
'use strict';
$('#fab').onclick=function(){if(!data){openSettings(!token());return;}if(!sim){openBalance();return;}openItem(null);};
$('#btnSettings').onclick=function(){openSettings(false);};
$('#btnReload').onclick=function(){load();};
$('#btnList').onclick=function(){if(data)openList();};
render();load();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
</body>
</html>
