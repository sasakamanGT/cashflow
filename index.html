<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>キャッシュフロー</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#f5f5f2;--card:#fff;--sub:#f0efea;--text:#1d1d1b;--text2:#66655f;--muted:#9a9993;--line:rgba(0,0,0,.1);
--accent:#1f6feb;--accent-bg:#e6f1fb;--ok:#2e7d32;--warn:#8a5a00;--warn-bg:#fff3cd;--warn-line:#efb100;--neg:#c62828;--neg-bg:#fdecea;
--bank:#378add;--total:#444441;--sec:#1d9e75;--sec-bg:#e1f5ee}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1f1f1d;--sub:#2a2a27;--text:#ecebe6;--text2:#b0afa8;--muted:#7d7c76;--line:rgba(255,255,255,.12);
--accent:#58a6ff;--accent-bg:#0c2d4f;--ok:#7bc67e;--warn:#f2c94c;--warn-bg:#3d3000;--warn-line:#d9a400;--neg:#ff7b72;--neg-bg:#4a1515;--total:#d3d1c7;--sec:#5dcaa5;--sec-bg:#063a2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:17px;font-weight:600;margin:0}
.hbtn{background:none;border:0;color:var(--text2);font-size:15px;padding:6px 8px;cursor:pointer}
#status{font-size:12px;color:var(--muted);margin-right:4px}
.sec{padding:12px 16px}
.banner{border-radius:10px;padding:10px 12px;border:1px solid}
.banner.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.banner.neg{background:var(--neg-bg);border-color:var(--neg);color:var(--neg)}
.banner.ok{background:var(--card);border-color:var(--line);color:var(--ok)}
.banner .t{font-size:12px}.banner .b{font-size:18px;font-weight:600;margin:2px 0}.banner .s{font-size:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.acc .l{font-size:11px;color:var(--text2)}.acc .v{font-weight:600;font-size:15px;white-space:nowrap}
.note{font-size:11px;color:var(--muted);margin-top:6px}
.me{border-radius:10px;padding:8px 10px;background:var(--sub)}
.me .l{font-size:11px;color:var(--text2)}.me .v{font-weight:600;white-space:nowrap}.me .s{font-size:11px;color:var(--text2);white-space:nowrap}
.me.warn{background:var(--warn-bg)}.me.warn .l,.me.warn .v{color:var(--warn)}
.me.neg{background:var(--neg-bg)}.me.neg .l,.me.neg .v{color:var(--neg)}
.lv-warn{color:var(--warn)!important}.lv-neg{color:var(--neg)!important}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.chart-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text2);gap:6px;flex-wrap:wrap}
.legend span{margin-right:10px;white-space:nowrap}.legend i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:3px}
.seg{display:inline-flex;gap:4px}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--text2);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
.seg button.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.tip{font-size:12px;min-height:18px;color:var(--text);margin:2px 2px 0}
.ctitle{font-size:12px;color:var(--text2);font-weight:600}
svg text{font-size:10px;fill:var(--muted)}
.mhead{padding:6px 16px;font-size:12px;color:var(--text2);background:var(--sub);position:sticky;top:49px;z-index:2}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:9px 16px;border-bottom:1px solid var(--line);align-items:center;background:var(--card);cursor:pointer}
.row .d{color:var(--text2);font-size:13px}.row .n{min-width:0}.row .n .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .a{text-align:right;white-space:nowrap}.row .bal{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.row.auto{background:var(--sub);color:var(--muted);cursor:default}
.tag{font-size:10px;padding:1px 5px;border-radius:4px;margin-left:4px;vertical-align:1px}
.tag.bank{background:var(--accent-bg);color:var(--accent)}.tag.sec{background:var(--sec-bg);color:var(--sec)}
.plus{color:var(--ok)}
.more{display:block;margin:12px auto;background:none;border:1px solid var(--line);color:var(--text2);border-radius:8px;padding:8px 16px;cursor:pointer}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:0;font-size:30px;line-height:56px;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;z-index:6}
.empty{text-align:center;padding:30px 16px;color:var(--text2)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:10px 14px;font-size:15px;cursor:pointer}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.dan{color:var(--neg)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:600px){.ov{align-items:center}.sheet{border-radius:14px}}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.sh-h b{font-size:16px}
.sh-b{padding:14px;display:flex;flex-direction:column;gap:12px}
.fl{font-size:12px;color:var(--text2);margin-bottom:4px}
input[type=text],input[type=date],input[type=password]{width:100%;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
input.amt{text-align:right;font-size:20px}
input.amt.active{border:2px solid var(--accent)}
.amtv{font-size:12px;color:var(--text2);text-align:right;min-height:16px}
.segf{display:grid;gap:6px}.segf button{border:1px solid var(--line);background:var(--card);color:var(--text2);border-radius:8px;padding:9px 4px;font-size:14px;cursor:pointer}
.segf button.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:20px;height:20px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 14px 14px;background:var(--sub);position:sticky;bottom:0}
.kp button{font-size:20px;padding:12px 0;border:0;border-radius:8px;background:var(--card);color:var(--text);cursor:pointer}
.kp button.f{color:var(--text2);font-size:16px}.kp button.ok{background:var(--accent);color:#fff;font-size:16px}
.lrow{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.lrow .x{font-size:12px;color:var(--text2)}
h3{font-size:13px;color:var(--text2);margin:10px 0 0;font-weight:600}
.phead{padding:8px 16px;font-size:13px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-top:1px solid var(--warn-line);border-bottom:1px solid var(--warn-line)}
.row.pend{background:var(--warn-bg)}.row.pend .d{color:var(--warn)}
.row.done .d{color:var(--ok)}
.tag.done{background:transparent;color:var(--ok);border:1px solid var(--ok)}
.tag.plan{background:transparent;color:var(--muted);border:1px solid var(--line)}
.amtrow{display:flex;gap:6px}.amtrow input{flex:1}.kpbtn{border:1px solid var(--line);background:var(--card);color:var(--text2);border-radius:8px;padding:0 10px;font-size:13px;cursor:pointer}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info{background:var(--sub);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--text2)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>キャッシュフロー</h1>
    <div><span id="status"></span><button class="hbtn" id="btnList" title="登録一覧">一覧</button><button class="hbtn" id="btnReload" title="再読み込み">⟳</button><button class="hbtn" id="btnSettings" title="設定">⚙</button></div>
  </header>
  <div id="main"></div>
</div>
<button class="fab" id="fab" aria-label="予定を追加">＋</button>
<div id="modal"></div>
<script src="calc.js"></script>
<script>
'use strict';
var OWNER='sasakamanGT', REPO='cashflow-data', FILE='data.json';
var ACC={bank:'銀行',sec:'証券'};
var data=null, sha=null, sim=null;
var view={all:false, months:2};
var coarse = window.matchMedia && matchMedia('(pointer:coarse)').matches;
var $=function(s,el){return (el||document).querySelector(s);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function yen(v){v=Math.round(v);return (v<0?'-¥':'¥')+Math.abs(v).toLocaleString('ja-JP');}
function num(v){return Math.round(v).toLocaleString('ja-JP');}
function lvCls(v){var l=CF.level(v);return l==='ok'?'':'lv-'+l;}
function md(s){var p=CF.parse(s);return p.m+'/'+p.d;}
function jd(s){var p=CF.parse(s);return p.y+'年'+p.m+'月'+p.d+'日';}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function token(){try{return localStorage.getItem('cf_token')||'';}catch(e){return '';}}
function setStatus(t){$('#status').textContent=t;}

// ---------- GitHub ----------
function b64enc(str){var b=new TextEncoder().encode(str),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
function b64dec(b64){var s=atob(b64.replace(/\s/g,'')),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new TextDecoder().decode(a);}
function api(method,body){
  return fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+FILE+(method==='GET'?'?t='+Date.now():''),{
    method:method,cache:'no-store',
    headers:{'Authorization':'Bearer '+token(),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
    body:body?JSON.stringify(body):undefined});
}
function emptyData(){return {version:1,balances:[],items:[],marks:{}};}
function load(){
  if(!token()){openSettings(true);return;}
  setStatus('読込中…');
  api('GET').then(function(r){
    if(r.status===404){data=emptyData();sha=null;return;}
    if(r.status===401||r.status===403) throw new Error('トークンが無効か、権限がありません（'+r.status+'）');
    if(!r.ok) throw new Error('読み込みに失敗しました（'+r.status+'）');
    return r.json().then(function(j){data=JSON.parse(b64dec(j.content));sha=j.sha;});
  }).then(function(){
    data.balances=data.balances||[];data.items=data.items||[];data.marks=data.marks||{};
    try{localStorage.setItem('cf_cache',JSON.stringify(data));}catch(e){}
    setStatus('');render();
  }).catch(function(e){
    setStatus('オフライン');
    try{var c=localStorage.getItem('cf_cache');if(c&&!data){data=JSON.parse(c);render();}}catch(x){}
    alert(e.message||'通信できませんでした');
  });
}
var saving=Promise.resolve();
function save(msg){
  try{localStorage.setItem('cf_cache',JSON.stringify(data));}catch(e){}
  render();
  saving=saving.then(function(){
    setStatus('保存中…');
    var body={message:msg||'update',content:b64enc(JSON.stringify(data,null,1))};
    if(sha)body.sha=sha;
    return api('PUT',body).then(function(r){
      if(r.status===409||r.status===422){setStatus('');alert('他の端末で更新されていました。最新のデータを読み込み直します（今の変更はもう一度入力してください）。');load();return;}
      if(!r.ok) throw new Error(r.status);
      return r.json().then(function(j){sha=j.content.sha;setStatus('保存済み');setTimeout(function(){if($('#status').textContent==='保存済み')setStatus('');},2000);});
    }).catch(function(e){setStatus('保存失敗');alert('保存に失敗しました（'+(e.message||e)+'）。通信状態を確認して、⟳で読み込み直してください。');});
  });
}

// ---------- 描画 ----------
function horizonEnd(){
  var t=CF.todayStr();
  if(sim.depletion){var a=CF.addMonths(sim.depletion,2),b=CF.addMonths(t,3);return a>b?a:b;}
  return CF.addMonths(t,24);
}
function render(){
  var m=$('#main');
  if(!data){m.innerHTML='<div class="empty">読み込み中…</div>';return;}
  sim=CF.simulate(data);
  if(!sim){
    m.innerHTML='<div class="empty"><p>はじめに、今日の残高を入力してください。</p><button class="btn pri" id="firstBal">残高を入力</button></div>';
    $('#firstBal').onclick=function(){openBalance();};
    return;
  }
  var t=sim.today, now=sim.current, h='';
  // 枯渇予測
  if(sim.depletion){
    var days=Math.round((CF.toDate(sim.depletion)-CF.toDate(t))/864e5);
    var y=Math.floor(days/365), mo=Math.floor((days%365)/30.44);
    var left=days<=0?'すでに不足':'あと'+(y?y+'年':'')+(mo||!y?mo+'か月':'');
    h+='<div class="sec"><div class="banner '+(days<92?'neg':'warn')+'"><div class="t">枯渇予測（2口座の合計）</div><div class="b">'+jd(sim.depletion)+'ごろ 0円</div><div class="s">'+left+(sim.below100k?'　／　10万円割れ：'+jd(sim.below100k):'')+'</div></div></div>';
  }else{
    h+='<div class="sec"><div class="banner ok"><div class="t">枯渇予測（2口座の合計）</div><div class="b">30年以内に0円にならない見込み</div>'+(sim.below100k?'<div class="s lv-warn">10万円割れ：'+jd(sim.below100k)+'</div>':'')+'</div></div>';
  }
  // 口座（実績ベース）
  h+='<div class="sec" style="padding-top:0"><div class="grid3">'+
    '<div class="acc" data-bal><div class="l">銀行</div><div class="v '+lvCls(now.bank)+'">'+yen(now.bank)+'</div></div>'+
    '<div class="acc" data-bal><div class="l">証券</div><div class="v '+lvCls(now.sec)+'">'+yen(now.sec)+'</div></div>'+
    '<div class="acc" data-bal style="background:var(--sub)"><div class="l">合計</div><div class="v '+lvCls(now.total)+'">'+yen(now.total)+'</div></div>'+
    '</div><div class="note">現在の残高（確定した実績まで）　最終の残高記録：'+md(sim.base.date)+'（タップして実際の残高を記録）</div></div>';
  // 月末残高
  h+='<div class="sec" style="padding-top:0"><div class="grid3">';
  for(var i=0;i<3;i++){
    var me=CF.monthEnd(CF.addMonths(t.slice(0,8)+'01',i)), b=CF.balanceAt(sim,me)||sim.daily[0], lv=CF.level(b.total);
    h+='<div class="me '+(lv==='ok'?'':lv)+'"><div class="l">'+CF.parse(me).m+'月末（合計）</div><div class="v">'+yen(b.total)+'</div><div class="s">銀行 <span class="'+lvCls(b.bank)+'">'+yen(b.bank)+'</span></div></div>';
  }
  h+='</div></div>';
  // 確認待ち
  if(sim.overdue.length){
    h+='<div class="phead">確認待ち（'+sim.overdue.length+'件）　タップして実績確認</div>';
    sim.overdue.forEach(function(e){h+=rowHtml(e,true);});
  }
  // 明細（実績＋予定）
  var until=CF.monthEnd(CF.addMonths(t.slice(0,8)+'01',view.months-1)), cur='';
  var ev=sim.events.filter(function(e){return e.date<=until&&!(e.kind==='plan'&&e.overdue);});
  if(!ev.length&&!sim.overdue.length) h+='<div class="empty">予定がありません。右下の＋から追加してください。</div>';
  ev.forEach(function(e){
    var mk=e.date.slice(0,7);
    if(mk!==cur){cur=mk;h+='<div class="mhead">'+CF.parse(e.date).y+'年'+CF.parse(e.date).m+'月</div>';}
    h+=rowHtml(e,false);
  });
  if(sim.events.some(function(e){return e.date>until;})) h+='<button class="more" id="more">もう3か月表示</button>';
  // グラフ（銀行のみ・合計）
  h+='<div class="sec"><div class="chartbox"><div class="chart-top"><span class="ctitle">銀行のみ</span><label class="chk" style="font-size:12px">全期間 <input type="checkbox" id="allChk" '+(view.all?'checked':'')+'></label></div>'+
    '<div id="chart_bank"></div><div class="tip" id="tip_bank">タップでその日の残高</div>'+
    '<div class="chart-top" style="margin-top:12px"><span class="ctitle">合計（2口座）</span></div>'+
    '<div id="chart_total"></div><div class="tip" id="tip_total">タップでその日の残高（確認待ちは今日に計上）</div></div></div>';
  m.innerHTML=h;
  m.querySelectorAll('[data-bal]').forEach(function(el){el.onclick=function(){openBalance();};});
  if($('#allChk'))$('#allChk').onchange=function(){view.all=this.checked;render();};
  m.querySelectorAll('.row[data-k]').forEach(function(el){el.onclick=function(){
    var e=sim.events.filter(function(x){return x.key===el.dataset.k&&x.kind===el.dataset.kind;})[0];
    if(!e)return; if(e.kind==='actual')openActual(e.key); else openConfirm(e);
  };});
  if($('#more'))$('#more').onclick=function(){view.months+=3;render();};
  drawChart('bank');drawChart('total');
}
function rowHtml(e,pend){
  var bal='<div class="bal">銀行 <span class="'+lvCls(e.bank)+'">'+num(e.bank)+'</span>　合計 <span class="'+lvCls(e.total)+'">'+num(e.total)+'</span></div>';
  if(e.kind==='auto') return '<div class="row auto"><span class="d">'+md(e.date)+'</span><span class="n"><div class="nm">補填（予測） 証券→銀行</div></span><span><div class="a">'+num(e.amount)+'</div>'+bal+'</span></div>';
  var src=e.kind==='actual'?e.mark:e.item, sign=src.type==='in'?'+':(src.type==='out'?'-':''), cls=src.type==='in'?'plus':'';
  var tag=src.type==='transfer'?'<span class="tag '+src.account+'">'+ACC[src.account]+'→'+ACC[src.to]+'</span>':'<span class="tag '+src.account+'">'+ACC[src.account]+'</span>';
  var st=e.kind==='actual'?'<span class="tag done">実績</span>':(pend?'':'<span class="tag plan">予定</span>');
  var rep=e.kind==='plan'&&e.item.repeat&&e.item.repeat!=='none'?' ↻':'';
  var d=pend?md(e.sched):md(e.date);
  return '<div class="row '+(pend?'pend':(e.kind==='actual'?'done':''))+'" data-k="'+esc(e.key)+'" data-kind="'+e.kind+'"><span class="d">'+d+'</span><span class="n"><div class="nm">'+(e.kind==='actual'?'✓ ':'')+esc(src.name||'（無題）')+rep+tag+st+'</div></span><span><div class="a '+cls+'">'+sign+num(e.amount)+'</div>'+(pend?'':bal)+'</span></div>';
}
function findItem(id){return data.items.filter(function(x){return String(x.id)===String(id);})[0];}

// ---------- グラフ ----------
function drawChart(K){
  var t=CF.todayStr(), end=horizonEnd();
  var past=[], fut=[];
  if(view.all){
    data.balances.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(b){
      if(b.date<sim.base.date) past.push({date:b.date,bank:b.bank,total:b.bank+b.sec});
    });
  }
  var startF = view.all? sim.base.date : (sim.base.date>t?sim.base.date:t);
  var st=CF.balanceAt(sim,startF)||sim.daily[0];
  fut.push({date:startF,bank:st.bank,total:st.total});
  sim.daily.forEach(function(d){if(d.date>startF&&d.date<=end)fut.push(d);});
  fut.push({date:end,bank:fut[fut.length-1].bank,total:fut[fut.length-1].total});
  if(past.length) past.push({date:sim.base.date,bank:sim.base.bank,total:sim.base.bank+sim.base.sec});
  var all=past.concat(fut);
  var x0=CF.toDate(all[0].date).getTime(), x1=CF.toDate(end).getTime(); if(x1<=x0)x1=x0+864e5;
  var COL=K==='bank'?'var(--bank)':'var(--total)';
  var vmin=0,vmax=100000; all.forEach(function(p){vmin=Math.min(vmin,p[K]);vmax=Math.max(vmax,p[K]);});
  vmax*=1.08; if(vmin<0)vmin*=1.1;
  var W=340,H=170,L=38,R=6,T=8,B=20;
  function X(s){return L+(CF.toDate(s).getTime()-x0)/(x1-x0)*(W-L-R);}
  function Y(v){return T+(vmax-v)/(vmax-vmin)*(H-T-B);}
  function path(pts,key){var d='';pts.forEach(function(p,i){var x=X(p.date).toFixed(1),y=Y(p[key]).toFixed(1);if(i===0)d+='M'+x+','+y;else d+='H'+x+'V'+y;});return d;}
  function lab(v){return Math.abs(v)>=10000?Math.round(v/10000)+'万':String(Math.round(v));}
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" id="csvg_'+K+'" style="touch-action:pan-y">';
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="#e24b4a" stroke-width=".8" stroke-dasharray="3 3"/>';
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(100000)+'" y2="'+Y(100000)+'" stroke="#ef9f27" stroke-width=".8" stroke-dasharray="3 3"/>';
  s+='<text x="'+(L-3)+'" y="'+(Y(0)+3)+'" text-anchor="end">0</text><text x="'+(L-3)+'" y="'+(Y(vmax)+8)+'" text-anchor="end">'+lab(vmax/1.08)+'</text>';
  if(Y(100000)<Y(0)-10&&Y(100000)>T+14) s+='<text x="'+(L-3)+'" y="'+(Y(100000)+3)+'" text-anchor="end">10万</text>';
  if(vmin<0) s+='<text x="'+(L-3)+'" y="'+(Y(vmin)+3)+'" text-anchor="end">'+lab(vmin/1.1)+'</text>';
  if(view.all&&t>=all[0].date&&t<=end) s+='<line x1="'+X(t)+'" x2="'+X(t)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--muted)" stroke-width=".6"/><text x="'+(X(t)+2)+'" y="'+(T+8)+'">今日</text>';
  if(K==='total'&&sim.depletion&&sim.depletion<=end) s+='<line x1="'+X(sim.depletion)+'" x2="'+X(sim.depletion)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="#e24b4a" stroke-width=".8"/>';
  if(past.length>1){s+='<path d="'+path(past,K)+'" fill="none" stroke="'+COL+'" stroke-width="2"/>';}
  var dash=view.all?' stroke-dasharray="4 2"':'';
  s+='<path d="'+path(fut,K)+'" fill="none" stroke="'+COL+'" stroke-width="2"'+dash+'/>';
  var a=CF.parse(all[0].date),z=CF.parse(end);
  s+='<text x="'+L+'" y="'+(H-5)+'">'+a.y+'/'+a.m+'</text><text x="'+(W-R)+'" y="'+(H-5)+'" text-anchor="end">'+z.y+'/'+z.m+'</text>';
  s+='<line id="cur_'+K+'" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--accent)" stroke-width=".8" visibility="hidden"/></svg>';
  $('#chart_'+K).innerHTML=s;
  var svg=$('#csvg_'+K);
  function pick(ev){
    var r=svg.getBoundingClientRect(), px=(ev.clientX-r.left)/r.width*W;
    if(px<L||px>W-R)return;
    var ms=x0+(px-L)/(W-L-R)*(x1-x0), d=CF.fromDate(new Date(ms)), p=null;
    all.forEach(function(q){if(q.date<=d)p=q;});
    if(!p)return;
    var c=$('#cur_'+K);c.setAttribute('x1',px);c.setAttribute('x2',px);c.setAttribute('visibility','visible');
    $('#tip_'+K).innerHTML=jd(d)+'　'+(K==='bank'?'銀行':'合計')+' <b class="'+lvCls(p[K])+'">'+yen(p[K])+'</b>'+(d>t?'（予測）':'');
  }
  svg.addEventListener('pointerdown',pick);svg.addEventListener('pointermove',function(e){if(e.buttons||e.pointerType==='mouse')pick(e);});
}

// ---------- 金額入力・テンキー ----------
function evalAmt(str){
  str=String(str||'').replace(/[,，\s¥円]/g,'').replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248);}).replace(/[＋]/g,'+').replace(/[−－ー]/g,'-');
  if(!str)return null;
  var total=0, ok=false, re=/([+-]?)([^+-]+)/g, m;
  while((m=re.exec(str))){
    var term=0, tm, r2=/(\d+)(万|千)?/g, found=false;
    while((tm=r2.exec(m[2]))){found=true;term+=Number(tm[1])*(tm[2]==='万'?10000:tm[2]==='千'?1000:1);}
    if(!found)continue; ok=true;
    total+=(m[1]==='-'?-1:1)*term;
  }
  return ok?total:null;
}
function bindAmt(input){
  var out=input.closest('div').parentNode.querySelector('.amtv');
  function upd(){var v=evalAmt(input.value);out.textContent=(v!==null&&/[+\-万千]/.test(input.value))?'= '+num(v)+' 円':'';}
  input.addEventListener('input',upd);upd();
  if(coarse){
    input.readOnly=true;input.setAttribute('inputmode','none');
    input.addEventListener('click',function(){showKeypad(input,upd);});
  }else{
    input.setAttribute('inputmode','numeric');
    var kb=input.parentNode.querySelector('.kpbtn');
    if(kb)kb.onclick=function(){showKeypad(input,upd);};
  }
}
var kpTarget=null;
function showKeypad(input,upd){
  var sheet=input.closest('.sheet'), kp=$('.kp',sheet);
  sheet.querySelectorAll('input.amt').forEach(function(x){x.classList.remove('active');});
  input.classList.add('active');kpTarget={input:input,upd:upd};
  if(!kp){
    kp=document.createElement('div');kp.className='kp';
    var keys=['7','8','9','⌫','4','5','6','万','1','2','3','千','0','00','000','+','C','-','','完了'];
    kp.innerHTML=keys.map(function(k){if(!k)return '<span></span>';var c=/^\d+$/.test(k)?'':(k==='完了'?'ok':'f');return '<button type="button" class="'+c+'" data-k="'+k+'">'+(k==='-'?'−':k)+'</button>';}).join('');
    sheet.appendChild(kp);
    kp.addEventListener('click',function(e){
      var k=e.target.dataset&&e.target.dataset.k;if(!k||!kpTarget)return;
      var inp=kpTarget.input,v=inp.value.replace(/,/g,'');
      if(k==='完了'){kp.remove();inp.classList.remove('active');kpTarget=null;return;}
      if(k==='⌫')v=v.slice(0,-1);else if(k==='C')v='';
      else if(k==='+'||k==='-'){if(v&&!/[+-]$/.test(v))v+=k;}
      else if(k==='万'||k==='千'){if(/\d$/.test(v))v+=k;}
      else v+=k;
      inp.value=v.replace(/\d+/g,function(d){return Number(d).toLocaleString('ja-JP');});
      kpTarget.upd();
    });
  }
  input.scrollIntoView({block:'nearest'});
}

// ---------- モーダル ----------
function openSheet(title,body,onSave,extra){
  var ov=document.createElement('div');ov.className='ov';
  ov.innerHTML='<div class="sheet"><div class="sh-h"><button class="hbtn" data-x>キャンセル</button><b>'+title+'</b>'+(onSave?'<button class="hbtn" data-s style="color:var(--accent);font-weight:600">保存</button>':'<span style="width:60px"></span>')+'</div><div class="sh-b">'+body+'</div></div>';
  $('#modal').appendChild(ov);
  var close=function(){ov.remove();kpTarget=null;};
  $('[data-x]',ov).onclick=close;
  ov.addEventListener('click',function(e){if(e.target===ov)close();});
  if(onSave)$('[data-s]',ov).onclick=function(){if(onSave(ov)!==false)close();};
  ov.querySelectorAll('input.amt').forEach(bindAmt);
  ov.querySelectorAll('.segf').forEach(function(g){g.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);});g.dataset.v=b.dataset.v;g.dispatchEvent(new Event('change'));});});
  if(extra)extra(ov,close);
  return ov;
}
function seg(name,opts,val){
  return '<div class="segf" data-name="'+name+'" data-v="'+val+'" style="grid-template-columns:repeat('+opts.length+',1fr)">'+opts.map(function(o){return '<button type="button" data-v="'+o[0]+'" class="'+(o[0]===val?'on':'')+'">'+o[1]+'</button>';}).join('')+'</div>';

function amtField(label,name,val){

}

function openItem(it){
  var isNew=!it;
  it=it||{type:'out',account:'bank',to:'sec',date:CF.todayStr(),name:'',amount:'',repeat:'none',until:'',shift:false};
  var names={};data.items.forEach(function(x){if(x.name)names[x.name]=1;});

    amtField('金額（例：2万3千、1万+5000）','amount',it.amount)+
    (isNew?seg('mode',[['done','✓ 実績'],['plan','予定']],'done'):'')+
    '<div id="planBox" style="display:flex;flex-direction:column;gap:12px"><div><div class="fl">繰り返し</div>'+seg('repeat',[['none','なし'],['monthly','毎月'],['yearly','毎年']],it.repeat||'none')+'</div>'+
    '<div id="untilBox"><div class="fl">終了日（空欄なら無期限）</div><input type="date" name="until" value="'+(it.until||'')+'"></div>'+
    '<div><div class="fl">土日祝・年末年始のとき</div>'+seg('shift',[['none','そのまま'],['prev','前営業日'],['next','翌営業日']],it.shift==='prev'?'prev':(it.shift?'next':'none'))+'</div></div>'+
    (isNew?'':'<button class="btn dan" id="del">この予定を削除</button>');
  openSheet(isNew?'追加':'予定を編集',body,function(ov){
    var g=function(n){return $('[data-name='+n+']',ov).dataset.v;};
    var amt=evalAmt($('[name=amount]',ov).value), date=$('[name=date]',ov).value;
    if(!date){alert('日付を入力してください');return false;}

    var o=isNew?{id:uid()}:it;
    o.type=g('type');o.account=g('account');o.to=o.type==='transfer'?(o.account==='bank'?'sec':'bank'):undefined;
    o.date=date;o.name=$('[name=name]',ov).value.trim();o.amount=amt;o.repeat=g('repeat');
    o.until=o.repeat==='none'?'':$('[name=until]',ov).value;var sv=g('shift');o.shift=sv==='prev'?'prev':(sv==='next');
    var done=isNew&&g('mode')==='done';
    if(done){o.repeat='none';o.until='';o.shift=false;}
    if(isNew)data.items.push(o);
    if(done){
      data.marks[CF.markKey(o,o.date)]={status:'done',date:o.date,amount:o.amount,type:o.type,account:o.account,to:o.to,name:o.name};
    }
    save((isNew?'add ':'edit ')+o.id);

      if(!confirm('「'+(it.name||'この予定')+'」を削除しますか？'+(it.repeat!=='none'?'（繰り返し分もすべて消えます）':'')))return;

    };
  });
}

function openBalance(rec){
  var t=CF.todayStr(), est=sim?sim.current:null;
  rec=rec||{date:t,bank:est?est.bank:'',sec:est?est.sec:''};
  var isEdit=data.balances.indexOf(rec)>=0;
  var body='<div class="note" style="margin:0">通帳や証券口座の実際の残高を入力します。確認待ちの予定は、先に実績確認しておくと差額が正しく出ます。</div>'+
    '<div><div class="fl">日付</div><input type="date" name="date" value="'+rec.date+'"></div>'+
    '<div class="info" id="ref"></div>'+
    amtField('銀行の残高','bank',rec.bank)+amtField('証券口座の現金','sec',rec.sec)+
    (isEdit?'<button class="btn dan" id="del">この記録を削除</button>':'');
  openSheet('残高を記録',body,function(ov){
    var d=$('[name=date]',ov).value,b=evalAmt($('[name=bank]',ov).value),s=evalAmt($('[name=sec]',ov).value);
    if(!d||b===null||s===null){alert('日付と2つの残高を入力してください（0円なら0）');return false;}
    var pend=sim?sim.events.filter(function(e){return e.kind==='plan'&&e.sched<=d;}).length:0;
    if(pend&&!confirm(md(d)+'までに確認待ちの予定が'+pend+'件あります。実際にはもう引き落とされている場合、二重に計算されます。このまま記録しますか？'))return false;
    var ref=CF.actualAt(data,d), msg='';
    if(isEdit){data.balances=data.balances.filter(function(x){return x!==rec;});}
    data.balances=data.balances.filter(function(x){return x.date!==d;});
    data.balances.push({date:d,bank:b,sec:s});
    if(ref&&!isEdit&&(ref.bank!==b||ref.sec!==s)) msg='アプリの計算との差額：銀行 '+(b-ref.bank>=0?'+':'')+num(b-ref.bank)+'　証券 '+(s-ref.sec>=0?'+':'')+num(s-ref.sec)+'\n（確認漏れの入出金がないか見直してみてください）';
    save('balance '+d);
    if(msg)setTimeout(function(){alert(msg);},50);
  },function(ov,close){
    var refUpd=function(){var d=$('[name=date]',ov).value,r=d?CF.actualAt(data,d):null;
      $('#ref',ov).innerHTML=r&&!isEdit?'アプリ上の残高（'+md(d)+'時点の実績）<br>銀行 '+yen(r.bank)+'　証券 '+yen(r.sec):'';
      $('#ref',ov).style.display=$('#ref',ov).innerHTML?'':'none';};
    $('[name=date]',ov).addEventListener('change',refUpd);refUpd();
    if($('#del',ov))$('#del',ov).onclick=function(){if(!confirm('この残高記録を削除しますか？'))return;data.balances=data.balances.filter(function(x){return x!==rec;});close();save('delete balance');};
  });
}

    '<div><div class="fl">アクセストークン'+(token()?'（設定済み）':'')+'</div><input type="password" name="tk" placeholder="'+(token()?'変更するときだけ入力':'github_pat_...')+'" autocomplete="off"></div>'+
    '<div class="note" style="margin:0">保存先：'+OWNER+'/'+REPO+'/'+FILE+'</div>'+
    (token()?'<button class="btn dan" id="rm">この端末からトークンを消す</button>':'');
  openSheet('設定',body,function(ov){
    var v=$('[name=tk]',ov).value.trim();
    if(v){try{localStorage.setItem('cf_token',v);}catch(e){alert('この端末に保存できませんでした');return false;}data=null;load();}
    else if(!token()){alert('トークンを入力してください');return false;}
  },function(ov,close){
    if($('#rm',ov))$('#rm',ov).onclick=function(){if(!confirm('この端末からトークンを消しますか？（GitHub上のデータは消えません）'))return;localStorage.removeItem('cf_token');localStorage.removeItem('cf_cache');data=null;close();render();openSettings(true);};
  });
}

$('#fab').onclick=function(){if(!data){openSettings(!token());return;}if(!sim){openBalance();return;}openItem(null);};
$('#btnSettings').onclick=function(){openSettings(false);};
$('#btnReload').onclick=function(){load();};
$('#btnList').onclick=function(){if(data)openList();};
render();load();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
</body>
